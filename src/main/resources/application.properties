spring.application.name=research
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.base-url=https://api.groq.com/openai/v1

spring.ai.openai.chat.model=qwen/qwen3.8-27b
#spring.ai.openai.chat.reasoning-effort=low
spring.ai.openai.chat.max-tokens=800


parallel.api.key=${PARALLEL_API_KEY:}

#Client
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.streamable-http.connections.parallel.url=https://mcp.parallel.ai
spring.ai.mcp.client.streamable-http.connections.parallel.endpoint=/mcp
spring.ai.mcp.client.initialized=false

#Server
spring.ai.mcp.server.stdio=false
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.name=research-mcp-server
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp-server





